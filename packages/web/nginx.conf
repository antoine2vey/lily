map_hash_bucket_size 128;

# Vite content-hashes everything under /assets/. A map instead of a location
# block, because a location with its own add_header drops the server's headers.
map $uri $asset_cache {
  default "";
  ~^/assets/ "public, max-age=31536000, immutable";
}

map $uri $blog_redirect {
  default "";
  include /etc/nginx/redirects.map;
}

server {
  listen __PORT__;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/manifest+json application/xml text/xml image/svg+xml text/plain;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cache-Control $asset_cache always;

  rewrite ^/(.+)/$ /$1 permanent;
  if ($blog_redirect) {
    return 301 $blog_redirect;
  }

  location = / {
    try_files /index.html =404;
  }

  location = /.well-known/apple-app-site-association {
    default_type application/json;
  }

  location ^~ /join/ {
    try_files $uri /join.html =404;
  }

  location ~ ^/(?<blog_locale>en|fr)/blog/page/[0-9]+$ {
    try_files $uri.html @blog_index;
  }

  location @blog_index {
    return 301 /$blog_locale/blog;
  }

  location / {
    try_files $uri $uri.html =404;
  }
}
