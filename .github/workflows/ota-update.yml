name: OTA Update

on:
  push:
    branches: [main]
    tags-ignore:
      - 'v*'
    paths:
      - 'packages/app/**'
      - 'packages/shared/**'
      - '!packages/app/eas.json'
      - '!packages/app/app.json'
      - '!packages/app/**/*.md'
      - '!packages/shared/**/*.md'
  # Manual trigger to publish the current HEAD on demand — e.g. to ship
  # app/shared changes that a server-only push left unpublished.
  workflow_dispatch:

# Every run publishes to the one EAS branch `production`, so all runs share
# one group and go one at a time. GitHub keeps one pending run per group and
# drops older pending ones; that is safe because the surviving run builds the
# newest commit and its diff starts at the last published commit, not at its
# own push.
# Never cancel: a cancelled run can leave a commit unpublished.
concurrency:
  group: ota-update-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    # Skip if this is a version tag commit
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    name: Publish OTA Update
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.affected.outputs.result }}
      last: ${{ steps.affected.outputs.last }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the affected-check can diff from the last
          # published commit, which may be many commits back.
          fetch-depth: 0
          # This job installs dependencies and runs the bundler. It gets no
          # token it could push with.
          persist-credentials: false

      - name: Fetch the last published commit
        run: |
          # fetch-depth 0 fetches branches and tags only. A missing ref is
          # fine: the next step then publishes (bootstrap).
          git fetch --no-tags origin "+refs/ota/production:refs/ota/production" \
            || echo "::notice::No refs/ota/production yet."

      - name: Check if app/shared was actually affected
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
          AFTER_SHA: ${{ github.sha }}
        # Only key=value lines may reach $GITHUB_OUTPUT: the runner fails the
        # step on anything else. The script sends its notices to stderr.
        run: bash scripts/ota-should-publish.sh >> "$GITHUB_OUTPUT"

      - name: Setup
        if: steps.affected.outputs.result == 'true'
        uses: ./.github/actions/setup
        with:
          turbo-cache: 'false'

      - name: Setup EAS
        if: steps.affected.outputs.result == 'true'
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update
        if: steps.affected.outputs.result == 'true'
        working-directory: packages/app
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          # Pass via env, not template substitution, so the shell never sees
          # unescaped quotes/special chars from the commit body.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Use only the subject line (first line). Commit bodies with
          # quotes or backticks previously broke eas update arg parsing.
          # head_commit is null on workflow_dispatch — fall back to git.
          SUBJECT="${COMMIT_MESSAGE%%$'\n'*}"
          if [ -z "$SUBJECT" ]; then
            SUBJECT="$(git log -1 --pretty=%s)"
          fi
          eas update \
            --branch production \
            --environment production \
            --message "$SUBJECT" \
            --non-interactive

  record:
    # Its own job so that only these two steps hold a token that can write to
    # the repository. Runs only after a publish that succeeded.
    name: Record the published commit
    needs: update
    if: ${{ needs.update.result == 'success' && needs.update.outputs.result == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Move refs/ota/production
        env:
          AFTER_SHA: ${{ github.sha }}
          LAST: ${{ needs.update.outputs.last }}
        run: |
          # The lease moves the ref only while it still holds the commit the
          # publish job diffed from (empty: the ref must not exist yet). A
          # re-run of this job after a newer run recorded its commit therefore
          # cannot move the ref back. A failed push leaves the ref behind, so
          # the next run diffs a wider range and publishes again.
          git push --force-with-lease="refs/ota/production:${LAST}" \
            origin "${AFTER_SHA}:refs/ota/production" \
            || echo "::warning::Could not move refs/ota/production from '${LAST}'; the next run will diff from the commit it holds."
