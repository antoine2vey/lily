name: OTA Update

on:
  push:
    branches: [main]
    tags-ignore:
      - 'v*'
    paths:
      - 'packages/app/**'
      - 'packages/shared/**'
      - '!packages/app/eas.json'
      - '!packages/app/app.json'
      - '!packages/app/**/*.md'
      - '!packages/shared/**/*.md'
  # Manual trigger to publish the current HEAD on demand — e.g. to ship
  # app/shared changes that a server-only push left unpublished.
  workflow_dispatch:

# Publishes queue in push order, one at a time, so the last run to finish is
# the newest commit. GitHub keeps one pending run per group and drops older
# pending ones; that is safe because the surviving run builds the newest commit
# and its diff starts at the last published commit, not at its own push.
# Never cancel: a cancelled run can leave a commit unpublished.
concurrency:
  group: ota-update-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    # Skip if this is a version tag commit
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    name: Publish OTA Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the affected-check can diff from the last
          # published commit, which may be many commits back.
          fetch-depth: 0

      - name: Fetch the last published commit
        run: |
          # fetch-depth 0 fetches branches and tags only. A missing ref is
          # fine: the next step then publishes (bootstrap).
          git fetch --no-tags origin "+refs/ota/production:refs/ota/production" \
            || echo "::notice::No refs/ota/production yet."

      - name: Check if app/shared was actually affected
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
          AFTER_SHA: ${{ github.sha }}
        run: bash scripts/ota-should-publish.sh | tee -a "$GITHUB_OUTPUT"

      - name: Setup
        if: steps.affected.outputs.result == 'true'
        uses: ./.github/actions/setup
        with:
          turbo-cache: 'false'

      - name: Setup EAS
        if: steps.affected.outputs.result == 'true'
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update
        if: steps.affected.outputs.result == 'true'
        working-directory: packages/app
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          # Pass via env, not template substitution, so the shell never sees
          # unescaped quotes/special chars from the commit body.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Use only the subject line (first line). Commit bodies with
          # quotes or backticks previously broke eas update arg parsing.
          # head_commit is null on workflow_dispatch — fall back to git.
          SUBJECT="${COMMIT_MESSAGE%%$'\n'*}"
          if [ -z "$SUBJECT" ]; then
            SUBJECT="$(git log -1 --pretty=%s)"
          fi
          eas update \
            --branch production \
            --environment production \
            --message "$SUBJECT" \
            --non-interactive

      - name: Record the published commit
        if: steps.affected.outputs.result == 'true'
        env:
          AFTER_SHA: ${{ github.sha }}
        run: |
          # Moved only after a successful publish, so a failed run leaves the
          # ref behind and the next run republishes the gap. If this push
          # fails, the next run's range is just wider: extra publish, never a
          # skipped one.
          git push --force origin "${AFTER_SHA}:refs/ota/production" \
            || echo "::warning::Could not move refs/ota/production; the next run will diff from the older commit."
