name: Experiment install cache

on:
  pull_request:
    paths:
      - '.github/workflows/exp-install.yml'

permissions:
  contents: read

jobs:
  zone-mutant:
    name: mutant ${{ matrix.mutant }} (must fail)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mutant: [guard-always-passes, rules-dir-missing, none]
    steps:
      - uses: actions/checkout@v7
      - name: Apply mutant
        run: |
          case '${{ matrix.mutant }}' in
            guard-always-passes) printf "console.log('zone rules ok')\n" > packages/api/src/probes/zone-rules.ts ;;
            rules-dir-missing) sed -i 's#ENV ICU_TIMEZONE_FILES_DIR=/app/packages/db/icu-tzdata#ENV ICU_TIMEZONE_FILES_DIR=/nowhere#' Dockerfile.prod ;;
          esac
      - name: Build the api image and probe its zone rules
        run: |
          {
            cat Dockerfile.prod
            echo 'RUN if env -u ICU_TIMEZONE_FILES_DIR bun run --cwd packages/api src/probes/zone-rules.ts >/tmp/probe.err 2>&1; then cat /tmp/probe.err; echo "the guard passed on the zone rules Bun bundles"; exit 1; fi; cat /tmp/probe.err; grep -q StaleZoneRulesError /tmp/probe.err'
            echo 'RUN bun run --cwd packages/api src/probes/zone-rules.ts'
          } | docker buildx build --progress=plain --output type=cacheonly -f - .
