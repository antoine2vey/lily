name: CI

on:
  push:
    branches: [main, develop]
    tags-ignore:
      - 'v*'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api_db: ${{ steps.filter.outputs.api_db }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api_db:
              - 'packages/api/**'
              - 'packages/db/**'
              - 'packages/knowledge-db/**'
              - 'packages/shared/**'
              - 'bun.lock'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup/**'
              - 'Dockerfile.postgres'
              - 'Dockerfile.prod'
              - '.dockerignore'

  checks:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check Turbo hashes every tracked file
        run: bash scripts/check-turbo-inputs.sh
      - name: Run Turbo pipeline
        run: bun x turbo run lint tsc test build
      - name: Check bundle sizes
        run: bash scripts/check-bundle-sizes.sh

  universal-links:
    name: Universal-link files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          turbo-cache: 'false'
      - name: Check the AASA and assetlinks.json
        run: bun packages/web/scripts/check-well-known.ts

  docs:
    name: Docs references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check doc links, paths and package coverage
        run: bash scripts/check-docs.sh

  integration:
    name: Integration tests (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.api_db == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      knowledge-postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lily_knowledge_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data:rw
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/lily_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/lily_test
      REDIS_URL_TEST: redis://localhost:6379/0
      KNOWLEDGE_DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5433/lily_knowledge_test
      # The zone rules Dockerfile.prod gives the api, in place of the older ones
      # Bun and Node bundle.
      ICU_TIMEZONE_FILES_DIR: ${{ github.workspace }}/packages/db/icu-tzdata
    steps:
      - uses: actions/checkout@v7
      # A service container cannot be built from a Dockerfile. This is the
      # image production runs, so the suite sees the same time zone data.
      - name: Start Postgres from Dockerfile.postgres
        run: |
          docker build -t lily-postgres - < Dockerfile.postgres
          docker run -d --name postgres -p 5432:5432 \
            --tmpfs /var/lib/postgresql/data:rw \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=lily_test \
            lily-postgres
          timeout 120 bash -c 'until docker exec postgres pg_isready -h 127.0.0.1 -U postgres -d lily_test; do sleep 1; done'
      - uses: ./.github/actions/setup
      - name: Setup test database
        run: bun run db:setup-test
      - name: Check Postgres accepts every time zone Bun knows, with Bun's offsets
        if: matrix.shard == 1
        run: bun run --filter=@lily/db db:check-time-zones
      - name: Run integration tests
        run: bun run test:integration --shard=${{ matrix.shard }}/4

  zone-rules:
    name: Zone rules in the api image
    needs: changes
    if: needs.changes.outputs.api_db == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the api image
        run: docker build -f Dockerfile.prod -t lily-api .
      # The api reads ICU_TIMEZONE_FILES_DIR through Bun on Alpine, a path no
      # unit test reaches. The first run proves the guard can fail, so the
      # second cannot pass on a probe that never reads the real offset.
      - name: Probe without the zone rules, expecting StaleZoneRulesError
        run: |
          if docker run --rm lily-api env -u ICU_TIMEZONE_FILES_DIR bun run --cwd packages/api src/probes/zone-rules.ts >probe.err 2>&1; then
            echo '::error::the guard passed on Bun'"'"'s bundled zone rules'
            exit 1
          fi
          cat probe.err
          grep -q StaleZoneRulesError probe.err
      - name: Probe with the zone rules the image ships
        run: docker run --rm lily-api bun run --cwd packages/api src/probes/zone-rules.ts

  summary:
    name: CI summary
    if: always()
    needs: [changes, checks, universal-links, docs, integration, zone-rules]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          changes='${{ needs.changes.result }}'
          checks='${{ needs.checks.result }}'
          universal_links='${{ needs.universal-links.result }}'
          docs='${{ needs.docs.result }}'
          integration='${{ needs.integration.result }}'
          zone_rules='${{ needs.zone-rules.result }}'
          echo "changes=$changes checks=$checks universal-links=$universal_links docs=$docs integration=$integration zone-rules=$zone_rules"
          if [ "$changes" != 'success' ]; then
            echo '::error::changes job did not succeed'
            exit 1
          fi
          if [ "$checks" != 'success' ]; then
            echo '::error::checks job did not succeed'
            exit 1
          fi
          if [ "$universal_links" != 'success' ]; then
            echo '::error::universal-links job did not succeed'
            exit 1
          fi
          if [ "$docs" != 'success' ]; then
            echo '::error::docs job did not succeed'
            exit 1
          fi
          if [ "$integration" != 'success' ] && [ "$integration" != 'skipped' ]; then
            echo '::error::integration job failed'
            exit 1
          fi
          if [ "$zone_rules" != 'success' ] && [ "$zone_rules" != 'skipped' ]; then
            echo '::error::zone-rules job failed'
            exit 1
          fi
