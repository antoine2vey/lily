name: CI

on:
  push:
    branches: [main, develop]
    tags-ignore:
      - 'v*'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      api_db: ${{ steps.filter.outputs.api_db }}
      web: ${{ steps.filter.outputs.web }}
      models: ${{ steps.filter.outputs.models }}
      pr_run: ${{ steps.reuse.outputs.pr_run }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api_db:
              - 'packages/api/**'
              - 'packages/db/**'
              - 'packages/knowledge-db/**'
              - 'packages/shared/**'
              - 'bun.lock'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup/**'
              - 'Dockerfile.prod'
              - '.dockerignore'
            web:
              - 'packages/web/**'
              - 'packages/shared/**'
              - 'bun.lock'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup/**'
            models:
              - '**/*.qnt'
              - 'scripts/check-models.sh'
              - 'scripts/quint.env'
              - '.github/workflows/ci.yml'
      # The PR run that passed on this exact tree already ran integration,
      # zone-rules, web-layout and models. main still runs checks, whose Turbo cache writes PR runs read.
      - name: Reuse a passing PR run on the same tree
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          url=$(bash scripts/reuse-pr-verdict.sh "$REPO" "$SHA" "$BEFORE" 2>"$RUNNER_TEMP/reason") || url=''
          cat "$RUNNER_TEMP/reason"
          cat "$RUNNER_TEMP/reason" >> "$GITHUB_STEP_SUMMARY"
          echo "pr_run=$url" >> "$GITHUB_OUTPUT"

  checks:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check Turbo hashes every tracked file
        run: bash scripts/check-turbo-inputs.sh
      - name: Check SQL applies no time zone but UTC
        run: bash scripts/check-sql-time-zones.sh
      - name: Check migration numbers and lock timeouts
        run: bash scripts/check-migrations.sh && bash scripts/test-check-migrations.sh
      - name: Check the AASA and assetlinks.json
        run: bun packages/web/scripts/check-well-known.ts
      - name: Run Turbo pipeline
        run: bun x turbo run lint tsc test build
      - name: Check bundle sizes
        run: bash scripts/check-bundle-sizes.sh
      - name: Check prerendered web pages hydrate cleanly
        timeout-minutes: 5
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          bun run --filter=@lily/web preview
          bun packages/web/scripts/hydration-check.ts
      - name: Check the watering calculator matches its model
        timeout-minutes: 5
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: bun packages/web/scripts/calculator-check.ts

  web-layout:
    name: Join page and consent banner
    needs: changes
    if: needs.changes.outputs.web == 'true' && needs.changes.outputs.pr_run == ''
    runs-on: ubuntu-latest
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build the web package
        run: bun x turbo run build --filter=@lily/web
      - name: Serve the prerendered build
        run: bun run --filter=@lily/web preview
      - name: Check the consent banner holds analytics until the visitor accepts
        timeout-minutes: 5
        run: bun packages/web/scripts/consent-check.ts
      - name: Check the join page keeps its open button above the consent banner
        timeout-minutes: 10
        run: bun packages/web/scripts/join-check.ts

  models:
    name: Quint models
    needs: changes
    if: needs.changes.outputs.models == 'true' && needs.changes.outputs.pr_run == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Quint fetches its evaluator through the GitHub API without a token,
      # and a shared runner's address is often over that rate limit.
      - name: Read the Quint pins
        id: quint
        run: cat scripts/quint.env >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: evaluator
        with:
          path: ~/.quint/rust-evaluator-${{ steps.quint.outputs.QUINT_EVALUATOR_VERSION }}
          key: quint-${{ steps.quint.outputs.QUINT_VERSION }}-rust-evaluator-${{ steps.quint.outputs.QUINT_EVALUATOR_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Fetch the Quint evaluator with a token
        if: steps.evaluator.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVALUATOR: ${{ steps.quint.outputs.QUINT_EVALUATOR_VERSION }}
        run: |
          dir=~/.quint/rust-evaluator-$EVALUATOR
          asset=quint_evaluator-x86_64-unknown-linux-gnu.tar.gz
          mkdir -p "$dir"
          gh release download "evaluator/$EVALUATOR" --repo quint-co/quint --pattern "$asset" --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$dir"
          chmod +x "$dir/quint_evaluator"
      - name: Check each model gives its expected verdict
        timeout-minutes: 10
        run: bash scripts/check-models.sh

  docs:
    name: Docs references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check doc links, paths and package coverage
        run: bash scripts/check-docs.sh
      # Bun alone, no install: the OTA check parses its workflow with Bun.YAML.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Check the OTA publish decision
        run: bash scripts/test-ota-should-publish.sh
      - name: Check the replay harness
        run: bash scripts/test-replay-check.sh
      - name: Check each lint rule against its fixture
        run: bash scripts/test-lint-rules.sh

  integration:
    name: Integration tests (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.api_db == 'true' && needs.changes.outputs.pr_run == ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      # The image production runs, so the suite meets the zone names it rejects.
      postgres:
        image: ghcr.io/railwayapp-templates/postgres-ssl:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lily_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d lily_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data:rw
      knowledge-postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lily_knowledge_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data:rw
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/lily_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/lily_test
      REDIS_URL_TEST: redis://localhost:6379/0
      KNOWLEDGE_DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5433/lily_knowledge_test
      # The zone rules Dockerfile.prod gives the api, in place of the older ones
      # Bun and Node bundle.
      ICU_TIMEZONE_FILES_DIR: ${{ github.workspace }}/packages/db/icu-tzdata
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Setup test database
        run: bun run db:setup-test
      - name: Check Postgres and Bun accept every canonical time zone
        if: matrix.shard == 1
        run: bun run --filter=@lily/db db:check-time-zones
      - name: Run integration tests
        run: bun run test:integration --shard=${{ matrix.shard }}/4

  zone-rules:
    name: Zone rules in the api image
    needs: changes
    if: needs.changes.outputs.api_db == 'true' && needs.changes.outputs.pr_run == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The api reads ICU_TIMEZONE_FILES_DIR through Bun on Alpine, a path no
      # unit test reaches. The probes run as extra RUN steps on top of
      # Dockerfile.prod, so they see the image's files and ENV without the
      # 80 s export of its layers. The first probe proves the guard can fail,
      # so the second cannot pass on a probe that never reads the real offset.
      - name: Build the api image and probe its zone rules
        run: |
          {
            cat Dockerfile.prod
            echo 'RUN if env -u ICU_TIMEZONE_FILES_DIR bun run --cwd packages/api src/probes/zone-rules.ts >/tmp/probe.err 2>&1; then cat /tmp/probe.err; echo "the guard passed on the zone rules Bun bundles"; exit 1; fi; cat /tmp/probe.err; grep -q StaleZoneRulesError /tmp/probe.err'
            echo 'RUN bun run --cwd packages/api src/probes/zone-rules.ts'
          } | docker buildx build --progress=plain --output type=cacheonly -f - .

  summary:
    name: CI summary
    if: always()
    needs: [changes, checks, docs, integration, zone-rules, web-layout, models]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          changes='${{ needs.changes.result }}'
          checks='${{ needs.checks.result }}'
          docs='${{ needs.docs.result }}'
          integration='${{ needs.integration.result }}'
          zone_rules='${{ needs.zone-rules.result }}'
          web_layout='${{ needs.web-layout.result }}'
          models='${{ needs.models.result }}'
          pr_run='${{ needs.changes.outputs.pr_run }}'
          echo "changes=$changes checks=$checks docs=$docs integration=$integration zone-rules=$zone_rules web-layout=$web_layout models=$models pr_run=$pr_run"
          if [ "$changes" != 'success' ]; then
            echo '::error::changes job did not succeed'
            exit 1
          fi
          if [ "$checks" != 'success' ]; then
            echo '::error::checks job did not succeed'
            exit 1
          fi
          if [ "$docs" != 'success' ]; then
            echo '::error::docs job did not succeed'
            exit 1
          fi
          if [ "$integration" != 'success' ] && [ "$integration" != 'skipped' ]; then
            echo '::error::integration job failed'
            exit 1
          fi
          if [ "$zone_rules" != 'success' ] && [ "$zone_rules" != 'skipped' ]; then
            echo '::error::zone-rules job failed'
            exit 1
          fi
          if [ "$web_layout" != 'success' ] && [ "$web_layout" != 'skipped' ]; then
            echo '::error::web-layout job failed'
            exit 1
          fi
          if [ "$models" != 'success' ] && [ "$models" != 'skipped' ]; then
            echo '::error::models job failed'
            exit 1
          fi
