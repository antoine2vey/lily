name: Setup
description: Bun, a frozen install, and the Turbo remote cache backed by the GitHub Actions cache.

inputs:
  bun-version:
    description: Bun version to install
    required: false
    default: '1.4.3'
  turbo-cache:
    description: Whether to wire up the Turbo remote-cache shim
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    # Deliberately uncached. Restoring the 1.3 GB Bun download cache took longer
    # than a cold install from the registry, and its copies pushed the Turbo
    # entries out of the repo's 10 GB Actions cache budget.
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Configure Turbo remote cache
      if: inputs.turbo-cache == 'true'
      uses: rharkor/caching-for-turbo@v2.5.2
